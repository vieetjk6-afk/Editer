name: Build Editer Anh (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "editer_anh/**"
      - "tests/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/build-anh.yml"
    tags:
      - "anh-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        # Dừng ngay khi BẤT KỲ lệnh nào lỗi (mặc định PowerShell chỉ xét lệnh cuối)
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller scikit-image tokenizers lupa

      - name: Tải mô hình AI (CLIP) + tính nhãn cảnh
        run: python packaging/get_model.py models

      - name: Test
        env:
          PYTHONIOENCODING: utf-8
          EDITER_MODELS: models
        run: |
          python -c "import onnxruntime as o; print('onnxruntime', o.__version__, o.get_available_providers())"
          python tests/test_ai.py
          python tests/test_look.py
          python tests/test_mauanh.py
          python tests/test_ps.py
          python tests/test_gui_api.py
          python tests/test_capnhat.py
          python tests/test_wb.py
          python tests/test_dongbo.py
          python tests/test_lightroom.py
          python -c "import webview; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else '?')"
          python tests/test_e2e.py "$env:RUNNER_TEMP\e2e"

      - name: Đóng gói .exe
        run: |
          pyinstaller --noconfirm packaging/editer.spec
          Get-ChildItem dist/editer-anh -Filter *.exe | ForEach-Object { $_.Name }
          Copy-Item packaging/HUONG-DAN.txt dist/editer-anh/
          Copy-Item -Recurse lightroom/Editer.lrplugin dist/editer-anh/
          Compress-Archive -Path dist/editer-anh -DestinationPath Editer-Anh-Windows.zip

      - name: Thử bản .exe (học + chỉnh thật trên ảnh giả lập)
        run: |
          dist/editer-anh/editer-anh.exe --version
          $out = dist/editer-anh/editer-anh.exe hoc "$env:RUNNER_TEMP\e2e\job" -o "$env:RUNNER_TEMP\pc.editer" | Out-String
          Write-Output $out
          if ($out -notmatch "AI hiểu ảnh: BẬT") { throw "bản .exe không bật được AI" }
          dist/editer-anh/editer-anh.exe chinh "$env:RUNNER_TEMP\e2e\moi" --phong-cach "$env:RUNNER_TEMP\pc.editer" --ghi-de --thu
          $out = dist/editer-anh/editer-anh.exe chinh "$env:RUNNER_TEMP\e2e\moi" --mau-jpg "$env:RUNNER_TEMP\e2e\mau.jpg" --ghi-de --thu | Out-String
          Write-Output $out
          if ($out -notmatch "AI phân vùng \(da, trắng, trời, cây\): BẬT") { throw "bản .exe không bật được AI phân vùng" }
          dist/editer-anh/editer-anh.exe --help | Out-Null

      - name: Thử bản .exe đồng bộ từ ảnh đã chỉnh (AI tìm da + chia cảnh)
        run: |
          $db = "$env:RUNNER_TEMP\dongbo"
          New-Item -ItemType Directory -Force $db | Out-Null
          Copy-Item "$env:RUNNER_TEMP\e2e\moi\*.dng" $db
          Copy-Item "$env:RUNNER_TEMP\e2e\moi\*.xmp" $db
          # giả lập: bạn mở 1 ảnh trong Camera Raw, chỉnh rồi bấm Done (Camera Raw ghi lại .xmp)
          $ref = Get-ChildItem $db -Filter *.xmp | Sort-Object Name | Select-Object -First 1
          $s = Get-Content $ref.FullName -Raw
          $s = [regex]::new('<rdf:Description ').Replace($s, '<rdf:Description crs:RawFileName="x.dng" ', 1)
          [IO.File]::WriteAllText($ref.FullName, ($s -replace 'x:xmptk="Editer[^"]*"', 'x:xmptk="Adobe XMP Core 9.1"'))
          $out = dist/editer-anh/editer-anh.exe dong-bo $db | Out-String
          Write-Output $out
          if ($out -notmatch "XONG: đồng bộ 29 ảnh") { throw "bản .exe không đồng bộ được" }
          if ($out -notmatch "AI tìm da người") { throw "bản .exe không bật được AI tìm da người" }

      - name: Thử bản .exe cho Lightroom (lr-dong-bo, lr-chep-mau, lr-chep-mau-anh, lr-cai)
        run: |
          $files = Get-ChildItem "$env:RUNNER_TEMP\e2e\moi" -Filter *.dng | Sort-Object Name
          $anh = @()
          $i = 0
          foreach ($f in $files) {
            $e = @{ path = $f.FullName; mau = ($i -eq 0) }
            if ($i -eq 0) { $e.thong_so = @{ Exposure2012 = 0.3; WhiteBalance = "Custom"; Temperature = 5600; Tint = 5 } }
            $anh += $e
            $i++
          }
          @{ ai = $true; anh = $anh } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\lr-viec.json"
          dist/editer-anh/editer-anh.exe lr-dong-bo "$env:RUNNER_TEMP\lr-viec.json" "$env:RUNNER_TEMP\lr-ket-qua.json"
          $r = Get-Content "$env:RUNNER_TEMP\lr-ket-qua.json" -Raw -Encoding utf8 | ConvertFrom-Json
          Write-Output ("lr-dong-bo: ok=" + $r.ok + ", " + $r.anh.Count + " ảnh")
          if (-not $r.ok -or $r.anh.Count -ne 29) { throw "lr-dong-bo trả kết quả sai" }
          $chep = @()
          foreach ($f in $files) { $chep += @{ path = $f.FullName } }
          @{ ai = $true; anh = $chep; mau_jpg = @("$env:RUNNER_TEMP\e2e\mau.jpg") } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\lr-chep.json"
          dist/editer-anh/editer-anh.exe lr-chep-mau "$env:RUNNER_TEMP\lr-chep.json" "$env:RUNNER_TEMP\lr-chep-kq.json"
          $c = Get-Content "$env:RUNNER_TEMP\lr-chep-kq.json" -Raw -Encoding utf8 | ConvertFrom-Json
          Write-Output ("lr-chep-mau: ok=" + $c.ok + ", " + $c.anh.Count + " ảnh; " + $c.bao_cao)
          if (-not $c.ok -or $c.anh.Count -ne 30) { throw "lr-chep-mau trả kết quả sai" }
          $x = "$env:RUNNER_TEMP\evoto"
          New-Item -ItemType Directory -Force $x | Out-Null
          Copy-Item "$env:RUNNER_TEMP\e2e\mau.jpg" "$x\a.jpg"
          Copy-Item "$env:RUNNER_TEMP\e2e\mau.jpg" "$x\b.jpg"
          $ja = @(@{ i = 0; vao = "$x\a.jpg"; goc = "$x\Ảnh cưới Đức.NEF"; thu_muc = "$x\Editer chep mau" },
                  @{ i = 1; vao = "$x\b.jpg"; goc = "$x\b.NEF"; thu_muc = "$x\Editer chep mau" })
          @{ ai = $true; do_manh = 80; anh = $ja; mau_jpg = @("$env:RUNNER_TEMP\e2e\mau.jpg") } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\lr-anh.json"
          dist/editer-anh/editer-anh.exe lr-chep-mau-anh "$env:RUNNER_TEMP\lr-anh.json" "$env:RUNNER_TEMP\lr-anh-kq.json"
          $e = Get-Content "$env:RUNNER_TEMP\lr-anh-kq.json" -Raw -Encoding utf8 | ConvertFrom-Json
          Write-Output ("lr-chep-mau-anh: ok=" + $e.ok + ", " + $e.so_anh + " ảnh mới; " + $e.anh[0].bao_cao)
          if (-not $e.ok -or $e.so_anh -ne 2 -or -not (Test-Path "$x\Editer chep mau\Ảnh cưới Đức-editer.jpg")) { throw "lr-chep-mau-anh trả kết quả sai" }
          dist/editer-anh/editer-anh.exe chep-mau-anh "$x\b.jpg" --mau "$env:RUNNER_TEMP\e2e\mau.jpg" --ra "$x\cli"
          if (-not (Test-Path "$x\cli\b-editer.jpg")) { throw "chep-mau-anh (dòng lệnh) không ra ảnh" }
          dist/editer-anh/editer-anh.exe lr-cai
          if (-not (Test-Path "$env:APPDATA\Adobe\Lightroom\Modules\Editer.lrplugin\EditerLR.lua")) { throw "lr-cai không cài được plugin" }
          if (-not (Test-Path "dist/editer-anh/Editer.lrplugin/Info.lua")) { throw "thiếu plugin trong bản đóng gói" }

      - name: Thử giao diện cửa sổ (không bắt buộc — máy build có thể không có màn hình)
        continue-on-error: true
        run: |
          $out = "$env:RUNNER_TEMP\gui-selftest.txt"
          $p = Start-Process -FilePath "dist/editer-anh/Editer Anh.exe" -ArgumentList "--tu-kiem-tra", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Output "giao diện: hết giờ chờ" }
          if (Test-Path $out) { Write-Output ("giao diện: " + (Get-Content $out -Raw)) } else { Write-Output "giao diện: không có kết quả" }
          $log = "$env:USERPROFILE\Editer\nhat-ky.txt"
          if (Test-Path $log) { Get-Content $log -Tail 25 }

      - name: Lấy số phiên bản
        id: ver
        run: |
          $v = python -c "import editer_anh; print(editer_anh.__version__)"
          "v=$v" >> $env:GITHUB_OUTPUT

      # Đăng lên Releases (không tốn hạn mức Artifacts của tài khoản).
      # Cùng số phiên bản thì file được thay bằng bản build mới nhất.
      - name: Đăng bản .exe lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anh-v${{ steps.ver.outputs.v }}
          name: Editer Ảnh ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            Tải **Editer-Anh-Windows.zip**, giải nén, bấm đúp `editer-anh.exe`.
            Hướng dẫn: `HUONG-DAN.txt` trong file zip.
          files: Editer-Anh-Windows.zip
